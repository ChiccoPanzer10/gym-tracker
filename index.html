<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Tracker</title>
    <!-- Configurazione PWA nativa per iOS/Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gym Tracker">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: ['selector', '[data-theme="dark"]']
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Tema Scurissimo / Dark */
        [data-theme="dark"] body {
            background-color: #0b0f19;
            color: #f3f4f6;
        }
        [data-theme="dark"] .glass-card {
            background: rgba(17, 24, 39, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        [data-theme="dark"] .nav-sticky {
            background: rgba(11, 15, 25, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Tema Chiaro / Light */
        [data-theme="light"] body {
            background-color: #f8fafc;
            color: #1e293b;
        }
        [data-theme="light"] .glass-card {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        [data-theme="light"] .nav-sticky {
            background: rgba(248, 250, 252, 0.9);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen pb-32">

    <!-- Header -->
    <header class="sticky top-0 z-40 glass-card backdrop-blur-md px-4 py-3.5 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"/>
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight">Gym Tracker</h1>
                <p class="text-xs opacity-70">Scheda 4 Giorni</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <!-- Pulsante Cambio Tema -->
            <button onclick="toggleTheme()" id="theme-btn" class="p-2.5 rounded-xl glass-card text-sm font-semibold transition hover:scale-105 active:scale-95" title="Cambia Tema">
                🌙
            </button>
            <button onclick="resetAllData()" class="px-3 py-2 rounded-xl glass-card text-xs font-semibold transition hover:opacity-80">
                🔄 Reset
            </button>
        </div>
    </header>

    <!-- Navigation Days Tabs -->
    <nav class="sticky top-[65px] z-30 nav-sticky backdrop-blur-md px-4 py-3">
        <div class="flex space-x-2 overflow-x-auto no-scrollbar" id="days-tabs">
            <!-- Generato via JS -->
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-xl mx-auto px-4 pt-4 space-y-4" id="workout-container">
        <!-- Generato via JS -->
    </main>

    <!-- Floating Timer Dock -->
    <div id="timer-dock" class="fixed bottom-4 left-4 right-4 max-w-xl mx-auto glass-card rounded-2xl p-4 shadow-2xl transition-all duration-300 translate-y-32 opacity-0 z-50">
        <div class="flex items-center justify-between mb-2">
            <div class="flex items-center space-x-2">
                <span class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-ping"></span>
                <span class="text-xs font-bold uppercase tracking-wider text-blue-500">Recupero in corso</span>
            </div>
            <span id="timer-display" class="text-2xl font-black font-mono">00:00</span>
        </div>
        <div class="text-xs opacity-80 truncate mb-3" id="timer-exercise-name">Esercizio</div>
        <div class="w-full bg-gray-700/30 h-1.5 rounded-full overflow-hidden mb-3">
            <div id="timer-progress" class="bg-blue-500 h-full w-full transition-all duration-1000"></div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="addTimerSeconds(10)" class="flex-1 py-2 glass-card rounded-xl text-xs font-bold transition">+10s</button>
            <button onclick="stopTimer()" class="flex-1 py-2 bg-red-500/20 text-red-500 rounded-xl text-xs font-bold border border-red-500/30 transition">Ferma</button>
        </div>
    </div>

    <!-- Celebration Modal -->
    <div id="victory-modal" class="fixed inset-0 bg-black/70 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="glass-card max-w-sm w-full rounded-3xl p-6 text-center shadow-2xl transform scale-95 transition-transform duration-300" id="victory-card">
            <div class="w-16 h-16 bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl">
                🏆
            </div>
            <h2 class="text-xl font-black mb-1">Ciclo Completato!</h2>
            <p class="text-xs opacity-70 mb-6">Hai completato tutti e 4 i giorni di allenamento. La scheda è stata resettata per un nuovo ciclo.</p>
            <button onclick="closeVictoryModal()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm shadow-lg shadow-emerald-600/30 transition">
                Ottimo, si ricomincia!
            </button>
        </div>
    </div>

    <script>
        const workoutData = [
            {
                day: 1,
                title: "1° Giorno",
                subtitle: "Petto, Gambe & Bicipiti",
                exercises: [
                    { id: "d1_e1", name: "panca piana bilanciere impugnatura larga", note: "rest pause set - rpe 5/6", sets: 3, reps: "10 + 8 dopo 20 sec", rest: 120 },
                    { id: "d1_e2", name: "croci su panca inclinata 30°", note: "time under tension (TUT: 3sE-2sI-1sC)", sets: 4, reps: "6/8 rep", rest: 60 },
                    { id: "d1_e3", name: "distesione manubri su panca inclinata 45°", note: "3+1 drop (4 serie totali)", sets: 4, reps: "12", rest: 60 },
                    { id: "d1_e4", name: "leg press singola", note: "", sets: 3, reps: "12+12", rest: 90 },
                    { id: "d1_e5", name: "super serie: leg extension + kb squat al parallelo", note: "TUT: 3sE-2sI-1sC", sets: 4, reps: "6/8 rep", rest: 60 },
                    { id: "d1_e6", name: "affondi in camminata", note: "3+1 drop (4 serie totali)", sets: 4, reps: "12", rest: 60 },
                    { id: "d1_e7", name: "curi con bilanciere EZ", note: "rest pause set - rpe 5/6", sets: 3, reps: "10 + 8 dopo 20 secondi", rest: 120 },
                    { id: "d1_e8", name: "curi ai cavi con corda", note: "2+2 drop (4 serie totali)", sets: 4, reps: "10", rest: 120 }
                ]
            },
            {
                day: 2,
                title: "2° Giorno",
                subtitle: "Dorso, Spalle & Tricipiti",
                exercises: [
                    { id: "d2_e1", name: "Lat machine avanti passo largo", note: "rest pause set - rpe 5/6", sets: 3, reps: "10 + 8 dopo 20 sec", rest: 120 },
                    { id: "d2_e2", name: "rematore con petto su panca inclinata 30°", note: "TUT: 1sC-2sI-3sE", sets: 4, reps: "6/8 rep", rest: 60 },
                    { id: "d2_e3", name: "pull down al cavo alto con barra dritta", note: "3+1 drop (4 serie totali)", sets: 4, reps: "12", rest: 60 },
                    { id: "d2_e4", name: "lento avanti manubrio singolo", note: "", sets: 3, reps: "12+12", rest: 90 },
                    { id: "d2_e5", name: "super serie: alzate laterali manubri + croci cavi incrociati", note: "TUT: 1sC-2sI-3sE", sets: 4, reps: "6/8 rep", rest: 60 },
                    { id: "d2_e6", name: "croci ai cavi dal basso", note: "3+1 drop (4 serie totali)", sets: 4, reps: "12", rest: 60 },
                    { id: "d2_e7", name: "french press bilanciere EZ", note: "rest pause set - rpe 5/6", sets: 3, reps: "10 + 8 dopo 20 secondi", rest: 120 },
                    { id: "d2_e8", name: "push down ai cavi con la corda", note: "2+2 drop (4 serie totali)", sets: 4, reps: "10", rest: 120 }
                ]
            },
            {
                day: 3,
                title: "3° Giorno",
                subtitle: "Petto, Gambe & Bicipiti Focus",
                exercises: [
                    { id: "d3_e1", name: "dip alle paraliele", note: "rest pause set - rpe 5/6", sets: 3, reps: "8/10 + 6/8 dopo 20 sec", rest: 120 },
                    { id: "d3_e2", name: "push up time under tension", note: "TUT: 3sE-2sI-3sC", sets: 4, reps: "6/8 rep", rest: 60 },
                    { id: "d3_e3", name: "croci ai cavi altezza spelle", note: "3+1 drop (4 serie totali)", sets: 4, reps: "12", rest: 60 },
                    { id: "d3_e4", name: "leg press singola", note: "", sets: 3, reps: "12+12", rest: 90 },
                    { id: "d3_e5", name: "s.s: stacchi rumeni con manubri + calf polpacci alla pressa", note: "TUT: 3sE-2sI-1sC", sets: 4, reps: "6/8 rep + 8/10 rep", rest: 60 },
                    { id: "d3_e6", name: "leg curl", note: "3+1 drop (4 serie totali)", sets: 4, reps: "12", rest: 60 },
                    { id: "d3_e7", name: "curl bicipiti al trx", note: "", sets: 3, reps: "10 + 8 dopo 20 secondi", rest: 120 },
                    { id: "d3_e8", name: "curl manubrio supinato su panca 60 gradi", note: "2+2 drop (4 serie totali)", sets: 4, reps: "10", rest: 120 }
                ]
            },
            {
                day: 4,
                title: "4° Giorno",
                subtitle: "Dorso, Spalle & Tricipiti Focus",
                exercises: [
                    { id: "d4_e1", name: "trazioni prone alla sbarra", note: "", sets: 3, reps: "6/8 + 4/6 dopo 20 sec", rest: 120 },
                    { id: "d4_e2", name: "chin up", note: "TUT: 3sE-2sI-3sC", sets: 4, reps: "3/5rep", rest: 60 },
                    { id: "d4_e3", name: "lat pulley", note: "3+1 drop (4 serie totali)", sets: 4, reps: "12", rest: 60 },
                    { id: "d4_e4", name: "alzate laterall con manubrio sul fianco su panca a 60°", note: "", sets: 3, reps: "12+12", rest: 90 },
                    { id: "d4_e5", name: "australian pull up + aperture posteriori su panca 30°", note: "TUT: 1sC-2sI-3sE", sets: 4, reps: "3/4 rep + 6/8 rep", rest: 60 },
                    { id: "d4_e6", name: "push press manubri", note: "3+1 drop (4 serie totali)", sets: 4, reps: "12", rest: 60 },
                    { id: "d4_e7", name: "french press al trx", note: "rpe 5/6", sets: 3, reps: "10 + 8 dopo 20 secondi", rest: 120 },
                    { id: "d4_e8", name: "push down ai cavi con barra dritta presa supina", note: "2+2 drop (4 serie totali)", sets: 4, reps: "10", rest: 120 }
                ]
            }
        ];

        let currentDay = 1;
        let userProgress = JSON.parse(localStorage.getItem('gym_tracker_progress')) || {};
        let currentTheme = localStorage.getItem('gym_tracker_theme') || 'dark';

        let timerInterval = null;
        let timerSecondsRemaining = 0;
        let timerTotalSeconds = 0;

        function initApp() {
            setTheme(currentTheme);
            renderTabs();
            renderWorkout();
        }

        function setTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('gym_tracker_theme', theme);
            document.getElementById('theme-btn').innerText = theme === 'dark' ? '🌙' : '☀️';
        }

        function toggleTheme() {
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        }

        function renderTabs() {
            const container = document.getElementById('days-tabs');
            container.innerHTML = '';
            workoutData.forEach(d => {
                const isSelected = d.day === currentDay;
                const completedCount = getDayCompletedCount(d.day);
                const totalCount = d.exercises.reduce((acc, ex) => acc + ex.sets, 0);
                const percent = Math.round((completedCount / totalCount) * 100);

                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 px-4 py-2.5 rounded-xl font-bold text-xs transition-all flex flex-col items-center border ${
                    isSelected 
                        ? 'bg-blue-600 border-blue-500 text-white shadow-lg shadow-blue-600/30' 
                        : 'glass-card opacity-70 hover:opacity-100'
                }`;
                btn.innerHTML = `
                    <span>${d.title}</span>
                    <span class="text-[10px] font-normal mt-0.5 opacity-80">${percent}%</span>
                `;
                btn.onclick = () => {
                    currentDay = d.day;
                    renderTabs();
                    renderWorkout();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                container.appendChild(btn);
            });
        }

        function getDayCompletedCount(dayNum) {
            const dayObj = workoutData.find(d => d.day === dayNum);
            if (!dayObj) return 0;
            let count = 0;
            dayObj.exercises.forEach(ex => {
                for (let i = 0; i < ex.sets; i++) {
                    if (userProgress[`${ex.id}_set_${i}`]) count++;
                }
            });
            return count;
        }

        function getTotalDaySets(dayNum) {
            const dayObj = workoutData.find(d => d.day === dayNum);
            if (!dayObj) return 0;
            return dayObj.exercises.reduce((acc, ex) => acc + ex.sets, 0);
        }

        function renderWorkout() {
            const container = document.getElementById('workout-container');
            const dayObj = workoutData.find(d => d.day === currentDay);
            
            const completedSets = getDayCompletedCount(currentDay);
            const totalSets = getTotalDaySets(currentDay);
            const progressPercent = Math.round((completedSets / totalSets) * 100);

            let html = `
                <div class="glass-card rounded-2xl p-4 mb-4 shadow-md">
                    <div class="flex justify-between items-center mb-2">
                        <h2 class="text-sm font-bold">${dayObj.title} - ${dayObj.subtitle}</h2>
                        <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-500 border border-blue-500/20">${completedSets}/${totalSets} completati</span>
                    </div>
                    <div class="w-full bg-gray-500/20 h-2 rounded-full overflow-hidden">
                        <div class="bg-blue-600 h-full transition-all duration-300" style="width: ${progressPercent}%"></div>
                    </div>
                </div>
            `;

            dayObj.exercises.forEach((ex, index) => {
                let allSetsChecked = true;
                for (let i = 0; i < ex.sets; i++) {
                    if (!userProgress[`${ex.id}_set_${i}`]) {
                        allSetsChecked = false;
                        break;
                    }
                }

                html += `
                    <div class="glass-card rounded-2xl p-4 mb-3 transition-all ${allSetsChecked ? 'border-emerald-500/50 bg-emerald-500/5' : ''}">
                        <div class="flex items-start justify-between mb-2">
                            <div class="space-y-0.5">
                                <div class="flex items-center space-x-2">
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-gray-500/10 opacity-80 border border-gray-500/20">ES. ${index + 1}</span>
                                    ${ex.note ? `<span class="text-[10px] text-blue-500 font-medium">${ex.note}</span>` : ''}
                                </div>
                                <h3 class="text-sm font-bold leading-snug pt-1 capitalize">${ex.name}</h3>
                            </div>
                            <div class="flex items-center space-x-1.5 px-2.5 py-1 rounded-lg bg-gray-500/10 text-xs border border-gray-500/20 flex-shrink-0">
                                <svg class="w-3.5 h-3.5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                <span class="font-mono">${ex.rest}s</span>
                            </div>
                        </div>

                        <div class="flex items-center justify-between text-xs opacity-75 mb-3 bg-gray-500/5 px-3 py-2 rounded-xl border border-gray-500/10">
                            <span>🔄 Reps: <strong class="opacity-100">${ex.reps}</strong></span>
                            <span>${ex.sets} Serie</span>
                        </div>

                        <div class="grid grid-cols-${ex.sets} gap-2">
                `;

                for (let i = 0; i < ex.sets; i++) {
                    const isChecked = !!userProgress[`${ex.id}_set_${i}`];
                    html += `
                        <button onclick="toggleSet('${ex.id}', ${i}, ${ex.rest}, '${ex.name.replace(/'/g, "\\'")}')" 
                            class="py-3 px-2 rounded-xl border flex flex-col items-center justify-center space-y-1 transition-all ${
                                isChecked 
                                    ? 'bg-emerald-600/20 border-emerald-500 text-emerald-500 shadow-md shadow-emerald-500/10' 
                                    : 'bg-gray-500/5 border-gray-500/20 opacity-80 hover:opacity-100'
                            }">
                            <span class="text-[10px] font-bold uppercase tracking-wider">Serie ${i + 1}</span>
                            <div class="w-5 h-5 rounded-full border ${isChecked ? 'bg-emerald-500 border-emerald-400 text-white' : 'border-gray-500/40'} flex items-center justify-center text-xs">
                                ${isChecked ? '✓' : ''}
                            </div>
                        </button>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function toggleSet(exerciseId, setIndex, restTime, exerciseName) {
            const key = `${exerciseId}_set_${setIndex}`;
            const currentState = !!userProgress[key];
            userProgress[key] = !currentState;

            saveData();
            renderTabs();
            renderWorkout();

            if (!currentState) {
                startTimer(restTime, exerciseName);
                if (navigator.vibrate) navigator.vibrate(50);
            }

            checkAllDaysCompleted();
        }

        function startTimer(seconds, exerciseName) {
            clearInterval(timerInterval);
            timerTotalSeconds = seconds;
            timerSecondsRemaining = seconds;

            const dock = document.getElementById('timer-dock');
            document.getElementById('timer-exercise-name').innerText = exerciseName;
            dock.classList.remove('translate-y-32', 'opacity-0');

            updateTimerUI();

            timerInterval = setInterval(() => {
                timerSecondsRemaining--;
                updateTimerUI();

                if (timerSecondsRemaining <= 0) {
                    clearInterval(timerInterval);
                    stopTimer();
                    playBeep();
                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                }
            }, 1000);
        }

        function updateTimerUI() {
            const minutes = Math.floor(timerSecondsRemaining / 60);
            const seconds = timerSecondsRemaining % 60;
            document.getElementById('timer-display').innerText = 
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            const progressPercent = (timerSecondsRemaining / timerTotalSeconds) * 100;
            document.getElementById('timer-progress').style.width = `${progressPercent}%`;
        }

        function addTimerSeconds(secs) {
            timerSecondsRemaining += secs;
            timerTotalSeconds = Math.max(timerTotalSeconds, timerSecondsRemaining);
            updateTimerUI();
        }

        function stopTimer() {
            clearInterval(timerInterval);
            const dock = document.getElementById('timer-dock');
            dock.classList.add('translate-y-32', 'opacity-0');
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) {}
        }

        function checkAllDaysCompleted() {
            let allDone = true;
            workoutData.forEach(d => {
                d.exercises.forEach(ex => {
                    for (let i = 0; i < ex.sets; i++) {
                        if (!userProgress[`${ex.id}_set_${i}`]) {
                            allDone = false;
                        }
                    }
                });
            });

            if (allDone) {
                showVictoryModal();
                userProgress = {};
                saveData();
            }
        }

        function showVictoryModal() {
            const modal = document.getElementById('victory-modal');
            const card = document.getElementById('victory-card');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                card.classList.remove('scale-95');
            }, 10);

            try {
                confetti({
                    particleCount: 120,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            } catch(e) {}
        }

        function closeVictoryModal() {
            const modal = document.getElementById('victory-modal');
            const card = document.getElementById('victory-card');
            modal.classList.add('opacity-0');
            card.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                renderTabs();
                renderWorkout();
            }, 300);
        }

        function resetAllData() {
            if (confirm("Vuoi davvero azzerare tutti i progressi di questa scheda?")) {
                userProgress = {};
                saveData();
                renderTabs();
                renderWorkout();
                stopTimer();
            }
        }

        function saveData() {
            localStorage.setItem('gym_tracker_progress', JSON.stringify(userProgress));
        }

        window.onload = initApp;
    </script>
</body>
</html>
